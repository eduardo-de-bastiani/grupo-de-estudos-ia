    {

    {

    },
    {

    {

    {
      "tipo": "associar",
      "enunciado": "Associe cada problema de ingestão à categoria que deve aparecer no resultado do pipeline.",
      "pares": [

          "Falha de validação da entrada"
        ],
        [
          "API de visão indisponível",
          "Falha de serviço na inferência remota"
        ],
        [
          "JSON de extração que não atende ao contrato",

        [

          "Conflito entre evidências válidas"
        ]
      ],
      "explicacao": "Separar categorias orienta a ação: corrigir arquivo, verificar serviço, tratar formato de saída ou conferir fontes conflitantes. Um conflito não significa necessariamente erro de decodificação. Uma API indisponível não justifica alterar os bytes. Distinguir causas ajuda a demonstrar uma falha controlada e evitar respostas inventadas."
    },
    {
      "tipo": "associar",
      "enunciado": "Associe as informações do contrato à pergunta de auditoria que elas ajudam a responder.",
      "pares": [
        [
          "Identificador da amostra",
          "Qual entrada originou este resultado?"
        ],
        [
          "Segmentos start/end/text",
          "Em qual trecho do áudio esta frase pode ser conferida?"
        ],
        [
          "Status e descrição de erro",
          "A etapa concluiu ou ficou bloqueada?"

        [
          "Campo extraído e fonte visual identificada",

        ]

      "explicacao": "Os contratos devem transportar conteúdo e estado com origem verificável. Um identificador não substitui os timestamps, e um timestamp não substitui o texto. Status diferencia resultado válido de falha; a ligação entre campo e fonte permite conferir extrações antes de construir uma resposta de negócio."
    }
  ]
